<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play That Shit!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ff5fae; --ink:#000000; --hot:#1a1a1a; --dim:rgba(0,0,0,.65); --line:rgba(0,0,0,.3); }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',Arial,sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:28px clamp(20px,5vw,56px) 64px; }
  header { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; font-size:20px; }
  #listeners { font-weight:400; font-size:15px; color:var(--dim); }
  .stage { padding:11vh 0 6vh; }
  .stage small { display:block; color:var(--dim); font-size:16px; margin-bottom:10px; }
  #title { font-size:clamp(40px,7vw,80px); font-weight:700; line-height:1.05; letter-spacing:-.02em; margin:0; overflow-wrap:anywhere; }
  #by { margin-top:14px; font-size:22px; }
  #by b { color:var(--hot); font-weight:700; }
  .bar { height:6px; background:var(--line); margin-top:32px; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--hot); }
  button { font:inherit; font-weight:700; background:var(--hot); color:#ffffff; border:0; border-radius:999px; padding:14px 28px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  #tune { margin-top:28px; font-size:20px; }
  section { margin-top:56px; }
  h2 { font-size:28px; font-weight:700; margin:0 0 14px; letter-spacing:-.01em; }
  ol { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-top:1px solid var(--line); }
  li span:last-child { color:var(--dim); text-align:right; flex-shrink:0; }
  .note { color:var(--dim); font-size:15px; margin:10px 0 0; }
  form { display:grid; gap:12px; max-width:480px; }
  input { font:inherit; padding:12px 14px; border-radius:10px; border:2px solid var(--line); background:transparent; color:var(--ink); }
  input::file-selector-button { font:inherit; font-weight:600; margin-right:12px; padding:6px 12px; border:0; border-radius:999px; background:var(--ink); color:#ffffff; cursor:pointer; }
  #msg { min-height:1.4em; margin:4px 0 0; }
  @media (prefers-reduced-motion: no-preference) { .bar i { transition: width .9s linear; } }

  @property --h { syntax: '<number>'; inherits: true; initial-value: 330; }
  
  html { transition: --h 2s ease; }
  
  body { background: none; }
  
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(120deg,
      hsl(calc(var(--h) - 45) 90% 72%),
      hsl(var(--h) 90% 68%),
      hsl(calc(var(--h) + 45) 90% 72%),
      hsl(var(--h) 90% 68%));
    background-size: 300% 300%;
    animation: drift 24s ease-in-out infinite;
  }
  
  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  
  @media (prefers-reduced-motion: reduce) {
    html { transition: none; }
    body::before { animation: none; }
  }

  #time { margin-top:8px; font-size:15px; color:var(--dim); font-variant-numeric:tabular-nums; }

  #vol { display:flex; align-items:center; gap:8px; font-weight:400; font-size:15px; color:var(--dim); }
  #vol input { width:110px; padding:0; border:0; accent-color:var(--ink); }

  #live { margin-top:10px; font-size:15px; color:var(--dim); min-height:1.4em; }
  #reactions { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  #reactions button { background:transparent; color:var(--ink); border:2px solid var(--line); padding:8px 16px; font-weight:600; }
  #reactions button b { font-weight:600; margin-left:4px; font-variant-numeric:tabular-nums; }
  #reactions button:active { transform:scale(.94); }
  #reactions button:disabled { opacity:.4; }
  #floaters { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .floater { position:absolute; bottom:-40px; font-size:32px; animation:floatup 2.6s ease-out forwards; }
  @keyframes floatup { to { transform:translateY(-80vh) rotate(var(--r)); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .floater { display:none; } }
  .ghost { background:transparent; color:var(--ink); border:2px solid var(--line); }
</style>
</head>
<body>
<main>
  <header><span>Play That Shit!</span><label id="vol">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label></header>

  <div class="stage">
    <small id="label">Now playing</small>
    <h1 id="title">Nothing yet</h1>
    <div id="by">Add the first song below.</div>
    <div class="bar"><i id="prog"></i></div>
    <div id="time"></div>
    <div id="live"><span id="nlisten"></span></div>
    <div id="reactions" role="group" aria-label="React to this song">
      <button data-e="fire" aria-label="Fire">🔥 <b>0</b></button>
      <button data-e="heart" aria-label="Love">❤️ <b>0</b></button>
      <button data-e="cry" aria-label="Crying">😭 <b>0</b></button>
      <button data-e="skull" aria-label="Dead">💀 <b>0</b></button>
    </div>
    <button id="tune" hidden>Tune in</button>
  </div>

  <section>
    <h2>Add a song</h2>
    <form id="form">
      <input id="file" type="file" accept="audio/*" required aria-label="Audio file">
      <input id="songTitle" placeholder="Song title" maxlength="80" aria-label="Song title">
      <input id="yourName" placeholder="Your name" maxlength="30" aria-label="Your name">
      <button id="submit">Add to queue</button>
      <button type="button" id="boostfake" class="ghost">🚀 Boost this song</button>
      <p class="note" id="boostmsg" role="status" style="margin:0"></p>
      <p id="msg" role="status"></p>
    </form>
    <p class="note" id="credits"></p>
    <p class="note">MP3, WAV, M4A, OGG or similar. Up to 25 MB and 15 minutes. Everyone listening hears it when it reaches the front of the queue.</p>
  </section>

  <section>
    <h2>Next up</h2>
    <ol id="next"></ol>
    <p class="note" id="loopnote"></p>
  </section>

  <section id="historySection" hidden>
    <h2>Recently played</h2>
    <ol id="history"></ol>
  </section>
</main>
<div id="floaters" aria-hidden="true"></div>

<audio id="audio" preload="auto"></audio>


<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@2.3.0/client';

const $ = (id) => document.getElementById(id);
const audio = $('audio');
let state = null;
let offset = 0;        // serverTime = Date.now() + offset
let bestRtt = Infinity;
let tunedIn = false;
let playingId = null;

const serverNow = () => Date.now() + offset;
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function syncClock() {
  try {
    const t0 = Date.now();
    const r = await fetch('/api/time', { cache: 'no-store' });
    const t1 = Date.now();
    const { now } = await r.json();
    const rtt = t1 - t0;
    if (rtt <= bestRtt * 1.5 + 50) { bestRtt = Math.min(bestRtt, rtt); offset = now + rtt / 2 - t1; }
  } catch (e) { console.error(e); }
}
  
async function poll() {
  try {
    const r = await fetch('/api/state');
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    state = data;
    render();
    sync();
  } catch (e) { console.error(e); }
  schedule();
}

// Poll every 5s, and exactly when the current song should end.
let timer;
function schedule() {
  clearTimeout(timer);
  let wait = document.hidden ? 30000 : 5000;
  if (state?.current) {
    const end = state.current.startedAt + state.current.song.duration * 1000;
    wait = Math.max(300, Math.min(wait, end - serverNow() + 150));
  }
  timer = setTimeout(poll, wait);
}

function render() {
  const cur = state.current;
  if (cur) {
    let h = 0;
    for (const c of cur.song.id) h = (h * 31 + c.charCodeAt(0)) % 360;
    document.documentElement.style.setProperty('--h', h);
  }
  $('title').textContent = cur ? cur.song.title : 'Nothing yet';
  $('by').replaceChildren(...(cur ? ['Added by ', Object.assign(document.createElement('b'), { textContent: cur.song.name })] : ['Add the first song below.']));
  $('label').textContent = cur ? 'Now playing' : 'Queue is empty';
  const ol = $('next'); ol.replaceChildren();
  for (const s of state.next) {
    const li = document.createElement('li');
    li.innerHTML = '<span></span><span></span>';
    li.children[0].textContent = s.title;
    li.children[1].textContent = s.looped ? `${s.name} · replay` : s.name;
    ol.append(li);
  }
  const looping = state.next.some((s) => s.looped);
  $('loopnote').textContent = !state.next.length ? '' : looping
    ? 'Nothing new in the queue, so earlier songs play again. New uploads jump ahead of replays.' : '';
  $('tune').hidden = tunedIn || !cur;
  renderLive();
}

function sync() {
  const cur = state.current;
  if (!cur) { audio.pause(); playingId = null; return; }
  const expected = (serverNow() - cur.startedAt) / 1000;
  if (expected >= cur.song.duration) return;
  if (playingId !== cur.song.id) {
    playingId = cur.song.id;
    audio.src = cur.song.url;
    audio.onloadedmetadata = () => {
      audio.currentTime = Math.min(Math.max(0, (serverNow() - cur.startedAt) / 1000), audio.duration - 0.1);
      if (tunedIn) audio.play().catch(() => {});
    };
  } else if (tunedIn && audio.readyState > 0 && Math.abs(audio.currentTime - expected) > 1.2) {
    audio.currentTime = expected; // drift correction
  }
}

// Volume slider
const vol = $('volume');
try { const v = localStorage.getItem('ptd-vol'); if (v !== null) vol.value = v; } catch {}
audio.volume = Number(vol.value);
vol.oninput = () => {
  audio.volume = Number(vol.value);
  try { localStorage.setItem('ptd-vol', vol.value); } catch {}
};
  
// ---------- Live: listeners, reactions, history, credits ----------
const EMOJI = { fire: '🔥', heart: '❤️', cry: '😭', skull: '💀' };
let shown = {}, shownFor = null, seen = null, myTaps = {}, credits = 1;

const cid = (() => {
  try { let v = localStorage.getItem('ptd-cid'); if (!v) { v = crypto.randomUUID(); localStorage.setItem('ptd-cid', v); } return v; }
  catch { return crypto.randomUUID(); }
})();
function ping() {
  if (!tunedIn) return; // only people actually listening are counted
  fetch('/api/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: cid }) }).catch(() => {});
}
setInterval(ping, 45000);

function floatEmoji(ch) {
  const el = document.createElement('span');
  el.className = 'floater';
  el.textContent = ch;
  el.style.left = (8 + Math.random() * 84) + 'vw';
  el.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
  $('floaters').append(el);
  setTimeout(() => el.remove(), 2700);
}

function renderLive() {
  const cur = state.current;
  $('nlisten').textContent = state.listeners ? `${state.listeners} listening` : '';

  const id = cur ? cur.song.id : null;
  if (shownFor !== id) { shownFor = id; shown = {}; seen = null; myTaps = {}; }
  const r = state.reactions || {};
  for (const b of document.querySelectorAll('#reactions button')) {
    const e = b.dataset.e;
    shown[e] = Math.max(r[e] || 0, shown[e] || 0);
    b.querySelector('b').textContent = shown[e];
    b.disabled = !cur;
  }
  // Float up emojis for other people's reactions (new since the last update).
  if (seen) for (const e in EMOJI) {
    const delta = (r[e] || 0) - (seen[e] || 0);
    if (delta > 0) {
      const mine = Math.min(myTaps[e] || 0, delta);
      myTaps[e] = (myTaps[e] || 0) - mine;
      for (let i = 0; i < Math.min(delta - mine, 6); i++) setTimeout(() => floatEmoji(EMOJI[e]), i * 180);
    }
  }
  seen = Object.fromEntries(Object.keys(EMOJI).map((e) => [e, Math.max(r[e] || 0, seen?.[e] || 0)]));

  const ol = $('history'); ol.replaceChildren();
  for (const h of state.history || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span></span><span></span>';
    li.children[0].textContent = h.title;
    li.children[1].textContent = `${h.name} · ${h.reactions} ${h.reactions === 1 ? 'reaction' : 'reactions'}`;
    ol.append(li);
  }
  $('historySection').hidden = !(state.history || []).length;
}

document.querySelectorAll('#reactions button').forEach((b) => {
  b.onclick = () => {
    const cur = state?.current;
    if (!cur) return;
    const e = b.dataset.e;
    shown[e] = (shown[e] || 0) + 1;
    myTaps[e] = (myTaps[e] || 0) + 1;
    b.querySelector('b').textContent = shown[e];
    floatEmoji(EMOJI[e]);
    fetch('/api/react', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ songId: cur.song.id, emoji: e }) }).catch(() => {});
  };
});

async function loadCredits() {
  try {
    const d = await (await fetch('/api/credits', { cache: 'no-store' })).json();
    credits = d.remaining;
    const t = new Date(d.resetsAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('credits').textContent = d.remaining > 0
      ? `${d.remaining} of ${d.total} uploads left today. Resets at ${t}.`
      : `You're out of uploads for today. They reset at ${t}.`;
    $('submit').disabled = d.remaining <= 0;
  } catch {}
}
loadCredits();

// ---------- Boost (fake, just to gauge demand) ----------
// REPLACE ME: right now this only records interest. Later, start a real checkout here
// (and replace api/boost.js to match).
$('boostfake').onclick = () => {
  for (let i = 0; i < 5; i++) setTimeout(() => floatEmoji('🚀'), i * 150);
  $('boostmsg').textContent = 'Boosting is coming soon. Thanks for your interest!';
  fetch('/api/boost', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cid }) }).catch(() => {});
};

$('tune').onclick = () => {
  tunedIn = true;
  $('tune').hidden = true;
  audio.play().catch(() => {});
  sync();
  ping();
};

// Progress bar
setInterval(() => {
  const cur = state?.current;
  if (!cur) { $('prog').style.width = '0'; $('time').textContent = ''; return; }
  const el = Math.min(cur.song.duration, Math.max(0, (serverNow() - cur.startedAt) / 1000));
  $('prog').style.width = `${(el / cur.song.duration) * 100}%`;
  $('time').textContent = `${fmt(el)} / ${fmt(cur.song.duration)}`;
}, 1000);

// Upload
$('yourName').value = localStorage.getItem('ptd-name') || '';
$('file').onchange = () => {
  const f = $('file').files[0];
  if (f && !$('songTitle').value) $('songTitle').value = f.name.replace(/\.[^.]+$/, '');
};

const getDuration = (file) => new Promise((resolve, reject) => {
  const a = new Audio(); const u = URL.createObjectURL(file);
  a.preload = 'metadata';
  a.onloadedmetadata = () => { URL.revokeObjectURL(u); resolve(a.duration); };
  a.onerror = () => reject(new Error("That file doesn't look like audio the browser can play"));
  a.src = u;
});

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const file = $('file').files[0];
  const msg = $('msg'); const btn = $('submit');
  btn.disabled = true; msg.textContent = 'Uploading…';
  try {
    const duration = await getDuration(file);
    if (!isFinite(duration) || duration < 5 || duration > 900) throw new Error('Songs must be between 5 seconds and 15 minutes');
    const blob = await upload(file.name, file, { access: 'public', handleUploadUrl: '/api/upload' });
    const name = $('yourName').value.trim();
    localStorage.setItem('ptd-name', name);
    const r = await fetch('/api/add', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: blob.url, title: $('songTitle').value, name, duration }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    msg.textContent = 'Added to the queue.';
    $('file').value = ''; $('songTitle').value = '';
    poll();
  } catch (err) { msg.textContent = err.message; }
  btn.disabled = false;
  loadCredits();
};

document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(timer); poll(); } });
(async () => {
  for (let i = 0; i < 3; i++) await syncClock();
  poll();
  setInterval(syncClock, 120000);
})();
</script>
</body>
</html>
